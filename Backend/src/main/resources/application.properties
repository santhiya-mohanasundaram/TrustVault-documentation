# ===================================================================
# TrustVault - Smart Personal Document Manager
# Spring Boot Configuration
# ===================================================================

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/trustvault_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Sant2006}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Multipart File Upload limits (PDF, JPG, JPEG, PNG up to 25MB)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Storage configuration
app.file.storage-dir=${FILE_STORAGE_PATH:./uploads/documents}

# JWT Authentication
app.jwt.secret=${JWT_SECRET:TrustVaultSuperSecretKey2026ForJwtSigningMustBeAtLeast256BitsLongEnterpriseSecure}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# Mail Configuration (Supports simulated delivery when SMTP is unconfigured)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:notifications@trustvault.io}
spring.mail.password=${MAIL_PASSWORD:secret}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Expiry Reminder Scheduler
app.scheduler.expiry-cron=0 0 1 * * ?

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:3000,http://127.0.0.1:5173}

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.com.trustvault=INFO
logging.level.org.springframework.security=INFO
